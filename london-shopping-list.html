<title>רשימת קניות - לונדון</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700&display=swap');

  :root{
    --navy:#14213D;
    --navy-2:#1E2E52;
    --red:#C8102E;
    --cream:#F5F1E8;
    --paper:#FBF8F2;
    --gold:#B08D57;
    --line:#DCD4C2;
    --ink:#20242E;
    --muted:#6B7180;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Heebo',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 80px;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
  }

  /* Header */
  header{
    position:relative;
    padding:22px 22px 26px;
    background:var(--navy);
    border-radius:4px;
    margin-bottom:22px;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  header::after{
    content:"";
    position:absolute;
    right:-30px;
    top:-30px;
    width:150px;
    height:150px;
    border-radius:50%;
    border:14px solid var(--red);
    opacity:0.9;
  }
  .eyebrow-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
    position:relative;
    z-index:1;
  }
  .eyebrow-left{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .lang-toggle-row{
    display:flex;
    gap:4px;
  }
  .lang-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    color:#C9CEDB;
    border-radius:12px;
    padding:3px 9px;
    font-size:11px;
    font-family:'Heebo',sans-serif;
    cursor:pointer;
  }
  .lang-btn.active{
    background:var(--paper);
    color:var(--navy);
    border-color:var(--paper);
    font-weight:600;
  }
  .login-lang-toggle{
    justify-content:center;
    margin-bottom:18px;
  }
  .login-lang-toggle .lang-btn{
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--muted);
  }
  .login-lang-toggle .lang-btn.active{
    background:var(--navy);
    color:var(--paper);
    border-color:var(--navy);
  }
  .tube-dot{
    width:10px;height:10px;border-radius:50%;background:var(--red);
    flex-shrink:0;
  }
  .eyebrow{
    font-size:13px;
    color:#C9CEDB;
    letter-spacing:0.02em;
  }
  .user-chip{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:#C9CEDB;
    cursor:pointer;
    background:rgba(255,255,255,0.08);
    padding:5px 10px 5px 6px;
    border-radius:20px;
    border:none;
  }
  .user-chip img{
    width:20px;height:20px;border-radius:50%;
  }
  h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:32px;
    color:var(--paper);
    margin:0 0 6px;
    position:relative;
    z-index:1;
    line-height:1.15;
  }
  .sub{
    color:#AEB4C4;
    font-size:14.5px;
    position:relative;
    z-index:1;
    max-width:320px;
  }

  /* Login screen */
  .login-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 24px;
    text-align:center;
  }
  .login-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:32px 26px;
    max-width:360px;
  }
  .login-title{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:20px;
    color:var(--navy);
    margin-bottom:8px;
  }
  .login-sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:24px;
    line-height:1.5;
  }
  .google-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    background:var(--navy);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:13px 18px;
    font-family:'Heebo',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .google-btn:hover{background:var(--navy-2);}
  .google-btn svg{width:18px;height:18px;flex-shrink:0;}
  .login-error{
    color:var(--red);
    font-size:14px;
    margin-top:14px;
  }
  .code-input{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:4px;
    padding:14px 12px;
    margin-bottom:14px;
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:0.5em;
    text-indent:0.5em;
    text-align:center;
    color:var(--navy);
  }
  .code-input:focus{outline:none; border-color:var(--gold);}
  .google-fallback{
    display:block;
    width:100%;
    margin-top:16px;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Heebo',sans-serif;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
  }
  .google-fallback:hover{color:var(--navy);}

  /* Sync status */
  .sync-note{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-bottom:16px;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .tab-btn{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:4px;
    padding:10px 4px;
    font-family:'Heebo',sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--navy);
    color:var(--paper);
    border-color:var(--navy);
  }

  /* "Today is ..." banner at the top of the daily plan */
  .today-banner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--navy);
    color:var(--paper);
    border-radius:4px;
    padding:12px 16px;
    margin-bottom:16px;
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:16px;
  }
  .today-banner .dot{
    width:8px;height:8px;border-radius:50%;background:var(--red);
    flex-shrink:0;
  }

  .day-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    margin-bottom:4px;
    overflow:hidden;
  }
  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #FFFDF9, var(--paper));
    gap:8px;
  }
  /* today's day, so it is recognisable even when every card is closed */
  .day-card.is-today{
    border-color:var(--red);
  }
  .day-card.is-today .day-head{
    background:#FBEAEA;
  }
  .day-card.is-today .day-label-input{
    color:var(--red);
  }
  .day-label-input{
    flex:1;
    border:none;
    background:transparent;
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:19px;
    color:var(--navy);
    padding:2px 2px;
  }
  .day-label-input:focus{outline:none; border-bottom:1px solid var(--gold);}
  .day-del{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    padding:2px 6px;
    flex-shrink:0;
  }
  .day-del:hover{color:var(--red);}

  .activities{
    list-style:none;
    margin:0;
    padding:0 8px;
  }
  .activity-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 4px;
    border-bottom:1px solid var(--line);
  }
  .activity-row:last-child{border-bottom:none;}
  .activity-time{
    width:56px;
    flex-shrink:0;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    padding:3px 3px;
    font-family:'Heebo',sans-serif;
    font-size:14px;
    color:var(--ink);
    text-align:center;
  }
  .activity-time:focus{outline:none; border-color:var(--gold);}
  .activity-title{
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    padding:4px 8px;
    font-family:'Heebo',sans-serif;
    font-size:16px;
    color:var(--ink);
  }
  .activity-title:focus{outline:none; border-color:var(--gold);}
  .activity-imgzone{
    width:84px;
    height:84px;
    flex-shrink:0;
    border:1.5px dashed var(--line);
    border-radius:4px;
    display:flex;
    align-items:center;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, onAuthStateChanged, signOut, signInAnonymously,

  collection, doc, setDoc, onSnapshot,
  deleteDoc, addDoc, serverTimestamp, query, orderBy, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXSywtG6nAosUSK8614LVCSdzVVQq7O-o",
  authDomain: "london-shopping-list.firebaseapp.com",
  projectId: "london-shopping-list",
  storageBucket: "london-shopping-list.firebasestorage.app",
  messagingSenderId: "1082293525814",
  appId: "1:1082293525814:web:59563d356a225872922797",
  measurementId: "G-M8R1GQ747Z"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Keep a full local copy of the lists on the device. This is what lets the app
// open, read and edit with no connection at all (on a plane, or with roaming
// off); everything written offline syncs by itself once there is signal again.
let db;

  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (err) {
  console.error('offline cache unavailable, falling back', err);
  db = getFirestore(app);
}
const provider = new GoogleAuthProvider();

// Hold the sign-in on this device for as long as the browser allows, so closing

setPersistence(auth, indexedDBLocalPersistence)
  .catch(() => setPersistence(auth, browserLocalPersistence))

  if (expandedStores.has(storeId)) expandedStores.delete(storeId);
  else expandedStores.add(storeId);
  render();
};

// Days the user closed by hand. Without this the auto-open below would keep
// re-opening today's card every time the list re-renders.
const userCollapsedDays = new Set();

window.toggleDayCollapse = function(dayId) {
  if (expandedDays.has(dayId)) {
    expandedDays.delete(dayId);
    userCollapsedDays.add(dayId);
  } else {
    expandedDays.add(dayId);
    userCollapsedDays.delete(dayId);

  renderDays();
};

window.toggleTopicCollapse = function(topicId) {
  if (expandedTopics.has(topicId)) expandedTopics.delete(topicId);
  else expandedTopics.add(topicId);
  renderPacking();
};

/* ---------- Today's date ---------- */

const DAY_NAMES = {
  he: ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'],
  en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
};

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function todayText() {
  const d = new Date();
  const date = `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
  const dayName = DAY_NAMES[currentLang][d.getDay()];
  return currentLang === 'he'
    ? `היום ${date} · יום ${dayName}`
    : `Today ${date} · ${dayName}`;
}

// Pull a date out of a free-text day label like "יום 1 - 28/09/26".
// Accepts 2- or 4-digit years and / . - separators. Returns null if there is none.
// Typing Hebrew leaves invisible direction marks scattered through the text, and
// they sit right between the digits often enough to break a naive match. Strip
// anything invisible and normalise odd dashes/spaces before reading the date.
function cleanLabel(label) {
  return String(label || '')
    .replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '')
    .replace(/[\u00A0\u2007\u202F]/g, ' ')
    .replace(/[\u2010-\u2015\u2212]/g, '-');
}

function parseLabelDate(label) {
  const text = cleanLabel(label);
  if (!text) return null;
  // No spaces allowed around the separators: with them, the dash in
  // "יום 10 - 23/09/26" would be read as a date separator and give 10/23/2009.
  const m = text.match(/(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{2,4})/);
  if (!m) return null;
  const day = parseInt(m[1], 10);
  const month = parseInt(m[2], 10);
  let year = parseInt(m[3], 10);
  if (year < 100) year += 2000;
  const d = new Date(year, month - 1, day);
  if (isNaN(d.getTime()) || d.getDate() !== day || d.getMonth() !== month - 1) return null;
  return d;
}

function labelIsToday(label) {
  const now = new Date();
  const d = parseLabelDate(label);
  if (d) {
    return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }
  // Fall back to a day/month written without a year, e.g. "יום 3 - 23/9".
  // Only / and . count here — a dash is far too often just a separator in the
  // title itself.
  const text = cleanLabel(label);
  const partial = text.match(/(\d{1,2})[/.](\d{1,2})(?![/.\d])/);
  if (!partial) return false;
  return parseInt(partial[1], 10) === now.getDate() && parseInt(partial[2], 10) === now.getMonth() + 1;
}

// Which calendar day the "open today's card" default was last applied for, so it
// re-applies by itself when the date rolls over while the page stays open.
let expandedDaysInitializedFor = null;

function applyTodayDefault() {
  const key = todayKey();
  if (expandedDaysInitializedFor !== key) {
    // A new calendar day: start the defaults over.
    expandedDaysInitializedFor = key;
    expandedDays.clear();
    userCollapsedDays.clear();
  }
  // Re-evaluated on every render rather than once at load, so a day that is
  // added or renamed to today's date afterwards opens too. Anything the user
  // closed by hand stays closed.
  days.forEach(d => {
    if (labelIsToday(d.label) && !userCollapsedDays.has(d.id)) expandedDays.add(d.id);
  });
}

function chevronSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// Generic pointer-based drag-to-reorder: works with mouse AND touch (iPhone Safari included).
// rootEl: an ancestor element to delegate pointerdown from (doesn't need to change across renders).
// itemSelector / handleSelector: CSS classes (no dot) for the draggable row and its grab handle.
// onDrop(newIdOrder, container) fires once the user releases, with the new sibling order (by
// data-id) and the actual parent element the drag happened within (so callers can find context,
// e.g. which store a reordered item belongs to).
function enableDragReorder(rootEl, itemSelector, handleSelector, onDrop) {
  rootEl.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.' + handleSelector);
    if (!handle) return;
    const dragEl = handle.closest('.' + itemSelector);
    if (!dragEl) return;
    const container = dragEl.parentElement;
    if (!container) return;
    e.preventDefault();
    dragEl.classList.add('dragging');
    isDragging = true;

    // The move/up listeners live on `document`, NOT on the handle. Earlier this
    // relied on pointer capture staying attached to the handle, but moving the
    // row with insertBefore() detaches and re-attaches it, which drops the
    // capture and killed the drag after the first step. Listening on the
    // document survives all of that.
    const onMove = (ev) => {
      ev.preventDefault();
      const y = ev.clientY;
      const items = [...container.querySelectorAll(':scope > .' + itemSelector)].filter(el => el !== dragEl);
      for (const sib of items) {
        const rect = sib.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        const dragIsAfter = !!(dragEl.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_PRECEDING);
        if (y < mid && dragIsAfter) {
          container.insertBefore(dragEl, sib);
          break;
        } else if (y > mid && !dragIsAfter) {
          container.insertBefore(dragEl, sib.nextSibling);
          break;
        }
      }
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      dragEl.classList.remove('dragging');
      isDragging = false;
      const newOrder = [...container.querySelectorAll(':scope > .' + itemSelector)].map(el => el.dataset.id);
      onDrop(newOrder, container);
    };
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

/* ---------- Undo ---------- */
// Every delete hands us a function that puts the thing back. We show the undo
// bar for a few seconds; if it isn't used, the deletion just stands.
let pendingUndo = null;
let undoTimer = null;
const UNDO_SECONDS = 12;

function offerUndo(name, undoFn) {
  pendingUndo = undoFn;
  undoMsg.textContent = t('deletedMsg')(name);
  undoBtn.classList.remove('hidden');
  undoToast.classList.remove('error', 'hidden');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, UNDO_SECONDS * 1000);
}

function hideUndo() {
  clearTimeout(undoTimer);
  pendingUndo = null;
  undoToast.classList.add('hidden');
}

// Surface a failed read/write instead of letting it fail silently — a denied
// Firestore rule used to look exactly like "the button does nothing".
function showError(text) {
  clearTimeout(undoTimer);
  pendingUndo = null;
  undoMsg.textContent = text;
  undoBtn.classList.add('hidden');
  undoToast.classList.add('error');
  undoToast.classList.remove('hidden');
  undoTimer = setTimeout(hideUndo, 9000);
}

// Firebase reports "anonymous sign-in is off" under more than one code, and any
// code we don't recognise is shown verbatim — guessing from a generic message
// wastes far more time than an ugly error string ever will.
const ANON_OFF_CODES = [
  'auth/operation-not-allowed',
  'auth/admin-restricted-operation',
  'auth/configuration-not-found'
];

function describeAuthError(err) {
  if (!navigator.onLine) return t('offlineFirstRun');
  const code = (err && err.code) || '';
  if (ANON_OFF_CODES.includes(code)) return t('anonDisabled');
  if (code === 'auth/unauthorized-domain') return t('domainNotAllowed');
  if (code === 'auth/network-request-failed') return t('loadFailed');
  return t('signInFailed') + (code ? ' (' + code + ')' : '');
}

// Some problems must not fade away after a few seconds — with no database
// session the whole app is inert, and the user needs to keep seeing why.
function showStickyError(text) {
  clearTimeout(undoTimer);
  pendingUndo = null;
  undoMsg.textContent = text;
  undoBtn.classList.add('hidden');
  undoToast.classList.add('error');
  undoToast.classList.remove('hidden');
}

// Every write goes through this first. Without a session the writes used to
// return silently, which looked exactly like a dead button.
function requireSession() {
  if (currentUser) return true;
  showStickyError(t('noSession'));
  return false;
}

async function attempt(fn) {
  try {
    return await fn();
  } catch (err) {
    console.error(err);
    showError(t('saveFailed'));
  }
}

undoBtn.addEventListener('click', async () => {

    await fn();

  }
});

// Restore a deleted array entry at the position it used to occupy, working off
// whatever the list looks like right now rather than a stale copy of it.
function restoreIntoArray(currentItems, item, index) {
  const arr = [...(currentItems || [])];
  arr.splice(Math.min(index < 0 ? arr.length : index, arr.length), 0, item);
  return arr;
}

async function signInWithGoogle() {
  loginError.classList.add('hidden');
  try {
    if (isStandalone) { await signInWithRedirect(auth, provider); return; }
    await signInWithPopup(auth, provider);
    hideUndo();
    showApp();
  } catch (err) {
    console.error(err);
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment' || err.code === 'auth/cancelled-popup-request') {
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { console.error(e2); }
    }
    showStickyError(describeAuthError(err));
  }
}

// Shared list: everyone who signs in reads/writes the same collection
const SHARED_PATH = ['trips', 'london', 'stores'];
const DAYS_PATH = ['trips', 'london', 'days'];
const PACKING_PATH = ['trips', 'london', 'packing'];

function listenToStores() {
  const storesRef = collection(db, ...SHARED_PATH);
  const q = query(storesRef, orderBy('createdAt', 'asc'));
  unsubscribeStores = onSnapshot(q, (snapshot) => {
    stores = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    // Stable sort: stores without an explicit 'order' keep their createdAt order
    stores.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    render();
  }, (err) => {
    console.error(err);
    showError(t('loadFailed'));
  });
}

function listenToDays() {
  const daysRef = collection(db, ...DAYS_PATH);
  const q = query(daysRef, orderBy('createdAt', 'asc'));
  unsubscribeDays = onSnapshot(q, (snapshot) => {

// Compress an image file into a small base64 data URL so it fits comfortably in Firestore
function compressImageFile(file, maxDim = 640, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

          ${handleHtml}
          <div class="checkbox ${item.checked ? 'checked' : ''}" onclick="toggleItem('${store.id}', '${item.id}')">${checkmarkSvg()}</div>
          <input type="text" class="item-name" value="${escapeHtml(item.name)}" onchange="updateItemName('${store.id}', '${item.id}', this.value)">
          <input type="number" min="1" class="qty-input" value="${qty}" onchange="updateQty('${store.id}', '${item.id}', this.value)">
          <input type="number" min="0" step="0.01" class="price-input" placeholder="£" value="${item.price ? item.price : ''}" onchange="updatePrice('${store.id}', '${item.id}', this.value)">
          ${rowTotalHtml}
          <button class="item-del" onclick="deleteItem('${store.id}', '${item.id}')">✕</button>
        </div>
      </li>`;
    };

    const storeTotalGbp = items.reduce((sum, i) => sum + (i.qty != null ? i.qty : 1) * (i.price || 0), 0);
    const storeTotalIls = storeTotalGbp * 4;
    const totalHtml = storeTotalGbp === 0 ? '' : `
      <div class="store-total">
        <span class="label">${t('total')}</span>
        <span class="amounts"><span class="gbp">£${storeTotalGbp.toFixed(2)}</span><span class="ils">₪${storeTotalIls.toFixed(2)}</span></span>
      </div>
    `;

    const pendingHtml = pending.length === 0
      ? (items.length === 0
          ? `<div class="empty-store">${t('emptyStore')}</div>`
          : `<div class="empty-store">${t('allBought')}</div>`)
      : '<ul class="items">' + pending.map(i => renderRow(i, true)).join('') + '</ul>';

    const purchasedHtml = purchased.length === 0 ? '' : `
      <div class="purchased-divider">${t('purchased')} (${purchased.length})</div>
      <ul class="items purchased-list">${purchased.map(i => renderRow(i, false)).join('')}</ul>
    `;

    const isCollapsed = !expandedStores.has(store.id);
    return `
      <div class="store" data-id="${store.id}">
        <div class="store-head">
          <span class="drag-handle store-drag-handle">⠿</span>
          <button class="collapse-btn ${isCollapsed ? 'collapsed' : ''}" onclick="toggleStoreCollapse('${store.id}')">${chevronSvg()}</button>
          <div class="store-title-row">
            <div class="store-mark"></div>
            <input type="text" class="store-name" value="${escapeHtml(store.name)}" onchange="updateStoreName('${store.id}', this.value)">
            <div class="cc-badge ${store.clickCollect ? 'active' : ''}" onclick="toggleClickCollect('${store.id}')">C&amp;C</div>
            <div class="store-count">${checkedCount}/${items.length}</div>
          </div>
          <button class="store-del" onclick="deleteStore('${store.id}')">✕</button>
        </div>
        ${isCollapsed ? '' : `
          ${pendingHtml}
          ${purchasedHtml}
          ${totalHtml}
          <div class="add-item">
            <input type="text" placeholder="${t('addItemPh')}" onkeydown="if(event.key==='Enter') addItem('${store.id}', this)">
            <button onclick="addItem('${store.id}', this.previousElementSibling)">${t('addItemBtn')}</button>
          </div>
        `}
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}
</script>
</body>
</html>
